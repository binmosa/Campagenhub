<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser-tab / home-screen icons, all cut from the same mark as the in-app logo (logo.png). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;700;900&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Campaign Hubz</title>
    <script src="https://checkout.flutterwave.com/v3.js"></script>
  </head>
  <!-- `landing-visitors` = the Campaign design system scope (tokens, type,
       story-ring cards, gradients). On <body> so the dashboard, the public

  <body class="landing-visitors">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
